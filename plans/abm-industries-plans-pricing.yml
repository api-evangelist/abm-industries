  any API. This was checked, not assumed: the ABM Connect product page carries no pricing and no
  "request a demo" pricing path, only a "Speak with the experts" contact CTA and a sales phone
  number (866.624.1520); ABM's own llms.txt site index of 594 pages contains no pricing page at
  all. ABM Connect is bundled into a facilities-services contract negotiated with ABM sales, so
  a caller cannot learn the cost of access without entering a sales conversation.
